name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the core next to the viewer
        uses: actions/checkout@v4
        with:
          repository: AlejoDuarte23/ifx-core
          ref: 2fcd0b9c39c3cdf55fdcd99b8188c20dabbc0510
          path: core-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the local core and Python tools
        run: |
          python -m pip install maturin
          maturin build --release --manifest-path core-source/Cargo.toml --out core-source/dist
          python -m pip install core-source/dist/*.whl
          python -m pip install --editable ".[dev]"
      - name: Build the WASM core
        working-directory: core-source
        run: ./scripts/build-wasm.sh
      - run: npm ci --prefix frontend
      - run: npm run test --prefix frontend
        env:
          IFX_CORE_SOURCE: ${{ github.workspace }}/core-source
      - run: npm run typecheck --prefix frontend
      - run: ruff format --check src tests examples scripts
      - run: ruff check src tests examples scripts
      - run: ty check
      - run: pytest -m "not integration"
